name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # .claude/rules/testing.md: core logic is developed on Linux first;
    # cross-platform verification (especially Windows, where the
    # rename-based .overwrite dance has OS-specific constraints) is owned
    # by this matrix rather than the local dev environment.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # windows-latest has no GNU Make preinstalled; ubuntu/macos do.
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: make check
        run: make check
        shell: bash

  race:
    # -race requires cgo (a C compiler). ubuntu-latest/macos-latest ship
    # one preinstalled; windows-latest does not have MinGW by default, so
    # it is intentionally excluded here rather than added to `check`'s
    # matrix (.claude/rules/testing.md).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: make race
        run: make race
        shell: bash

  drivers:
    # tests/drivers (phase 4 Step 7 + follow-up): each of Python/psycopg2,
    # Node.js/node-postgres, Java/pgJDBC, .NET/Npgsql, psqlODBC (via
    # pyodbc), PHP/PDO_PGSQL, Ruby/pg, and Rust/postgres connects to
    # ExecDB's pgwire with its own default settings (no ExecDB-specific
    # workaround flags -- Npgsql's connection string and ExecDB's own
    # server-side pg_catalog compatibility views, cmd/execdb/pgcatalog.go,
    # are the two documented exceptions; see tests/drivers/README.md).
    # Runs on ubuntu-latest only -- unlike `check`'s 3-OS matrix, this job
    # verifies the pgwire protocol implementation itself (OS-independent),
    # not platform-specific behavior, so eight extra runtimes across three
    # OSes would not buy anything (.claude/rules/testing.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Install unixODBC + psqlODBC + pyodbc
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev odbc-postgresql
          pip install pyodbc

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: shivammathur/setup-php@2.37.2
        with:
          php-version: "8.2"
          extensions: pdo_pgsql

      - uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: "3.1"
          bundler-cache: false

      - name: Install libpq-dev (needed to build the pg gem's native extension)
        run: sudo apt-get install -y libpq-dev

      - name: Install pg gem
        run: gem install pg --no-document

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: make build
        run: make build

      - name: tests/drivers/run-all.sh
        run: bash tests/drivers/run-all.sh bin/execdb 15538

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Intentionally not pinned to a specific patch beyond the major
      # release: a vulnerability scanner needs a current CVE database more
      # than build reproducibility, so staying on the latest v0 release is
      # the deliberate choice here (unlike other actions in this repo,
      # which are pinned to exact versions).
      - name: Run trivy (vulnerabilities + license check)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,license
          severity: HIGH,CRITICAL
          exit-code: "1"
